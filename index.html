<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#005ca9">

  <title>MyBenz</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <a class="brand" href="#">
      <div class="brand-mark">
        <img
          src="logo.png"
          alt="MyBenz"
          class="brand-logo">
      </div>

      <div class="brand-copy">
        <span class="brand-name">MyBenz</span>

        <span class="brand-tagline">
          Monitora consumi, rifornimenti e costi della tua auto.
        </span>
      </div>
    </a>

    <div class="topbar-actions">
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button">

        <span id="theme-toggle-icon">☾</span>
        <span id="theme-toggle-label">Scuro</span>

      </button>
    </div>
  </header>

  <main class="page">

    <section class="intro">

      <div>
        <p class="eyebrow">GESTIONE AUTO</p>

        <h1>Controlla ogni pieno.</h1>

        <p class="intro-copy">
          Traccia carburante, consumi e manutenzione in un unico posto.
        </p>

      </div>

    </section>

    <nav class="tabs">

      <button
        id="tab-registro"
        class="tab-button is-active"
        type="button">
        Registro
      </button>

      <button
        id="tab-storico"
        class="tab-button"
        type="button">
        Pieni e Spese
      </button>

      <button
        id="tab-grafici"
        class="tab-button"
        type="button">
        Grafici
      </button>

    </nav>

    <section id="panel-registro">

      <h2>Nuovo movimento</h2>

    </section>

    <section
      id="panel-storico"
      hidden>

      <h2>Pieni e Spese</h2>

    </section>

    <section
      id="panel-grafici"
      hidden>

      <h2>Grafici</h2>

    </section>

  </main>

  <script src="app.js"></script>

</body>

</html>
