<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#005ca9">

  <title>MyBenz</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <a class="brand" href="#">
      <div class="brand-mark">
        <img
          src="logo.png"
          alt="MyBenz"
          class="brand-logo">
      </div>

      <div class="brand-copy">
        <span class="brand-name">MyBenz</span>

        <span class="brand-tagline">
          Monitora consumi, rifornimenti e costi della tua auto.
        </span>
      </div>
    </a>

    <div class="topbar-actions">
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button">

        <span id="theme-toggle-icon">☾</span>
        <span id="theme-toggle-label">Scuro</span>

      </button>
    </div>
  </header>

  <main class="page">

    <section class="intro">

      <div>
        <p class="eyebrow">GESTIONE AUTO</p>

        <h1>Controlla ogni pieno.</h1>

        <p class="intro-copy">
          Traccia carburante, consumi e manutenzione in un unico posto.
        </p>

      </div>

    </section>

    <nav class="tabs">

      <button
        id="tab-registro"
        class="tab-button is-active"
        type="button">
        Registro
      </button>

      <button
        id="tab-storico"
        class="tab-button"
        type="button">
        Pieni e Spese
      </button>

      <button
        id="tab-grafici"
        class="tab-button"
        type="button">
        Grafici
      </button>

    </nav>

    <section id="panel-registro">

  <h2>Nuovo movimento</h2>

  <form id="entry-form">

    <div class="field">
      <label for="record-type">Tipo</label>

      <select id="record-type" name="record-type">

        <option value="fuel">
          Pieno
        </option>

        <option value="expense">
          Spesa
        </option>

      </select>
    </div>

    <div id="fuel-fields">

      <div class="field">
        <label>Data</label>
        <input type="date" id="fuel-date">
      </div>

      <div class="field">
        <label>Km auto</label>
        <input type="number" id="fuel-odometer">
      </div>

      <div class="field">
        <label>Tipo carburante</label>

        <select id="fuel-type">

          <option>Benzina 95</option>
          <option>Benzina 98</option>
          <option>Diesel</option>
          <option>GPL</option>
          <option>Metano</option>
          <option>Elettrico</option>
          <option>Altro</option>

        </select>
      </div>

      <div class="field">
        <label>Litri</label>
        <input type="number" step="0.01" id="fuel-liters">
      </div>

      <div class="field">
        <label>Costo totale</label>
        <input type="number" step="0.01" id="fuel-cost">
      </div>

      <div class="field">
        <label>Distributore</label>
        <input type="text" id="fuel-station">
      </div>

      <div class="field">
        <label>Note</label>
        <input type="text" id="fuel-note">
      </div>

    </div>

    <div id="expense-fields" hidden>

      <div class="field">
        <label>Data</label>
        <input type="date" id="expense-date">
      </div>

      <div class="field">
        <label>Categoria</label>

        <select id="expense-category">

          <option>Tagliando</option>
          <option>Cambio olio</option>
          <option>Filtro aria</option>
          <option>Filtro abitacolo</option>
          <option>Pastiglie freni</option>
          <option>Dischi freni</option>
          <option>Gomme</option>
          <option>Batteria</option>
          <option>Revisione</option>
          <option>Assicurazione</option>
          <option>Bollo</option>
          <option>Parcheggio</option>
          <option>Pedaggio</option>
          <option>Lavaggio</option>
          <option>Altro</option>

        </select>
      </div>

      <div class="field">
        <label>Costo</label>
        <input type="number" step="0.01" id="expense-cost">
      </div>

      <div class="field">
        <label>Officina / Fornitore</label>
        <input type="text" id="expense-vendor">
      </div>

      <div class="field">
        <label>Note</label>
        <input type="text" id="expense-note">
      </div>

    </div>

    <button
      class="theme-toggle"
      type="submit">

      Salva

    </button>

  </form>

</section>

    <section
  id="panel-storico"
  hidden>

  <h2>Pieni e Spese</h2>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>Data</th>
          <th>Tipo</th>
          <th>Dettaglio</th>
          <th>Costo</th>
          <th></th>
        </tr>
      </thead>

      <tbody id="history-list">

      </tbody>

    </table>

  </div>

</section>

      <h2>Pieni e Spese</h2>

    </section>

    <section
      id="panel-grafici"
      hidden>

      <h2>Grafici</h2>

    </section>

  </main>

  <script src="app.js"></script>

</body>

</html>
